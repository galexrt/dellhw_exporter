name: build_release
on:
  push:
    tags:
      - 'v*'
jobs:
  build_release:
    # Depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: |
          make test
          make promu
          make check_license

      - name: Generate source SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: make sbom

      - name: Build and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          promu crossbuild
          promu crossbuild tarballs
          promu checksum .tarballs
          promu release .tarballs

      - name: Build and push to GHCR.io
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: ${{ github.repository }}
          registry: ghcr.io
          username: galexrt
          password: ${{ secrets.GITHUB_TOKEN }}
          tag_names: true

      - name: Login to GHCR.io for image SBOM generation
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and upload SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker pull "$IMAGE"
          make sbom-image IMAGE="$IMAGE"
          gh release upload "$GITHUB_RELEASE_TAG" \
            dellhw_exporter.sbom.spdx.json \
            dellhw_exporter.image.sbom.spdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Build and push to Quay.io
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: ${{ github.repository }}
          registry: quay.io
          username: ${{ secrets.REGISTRY_QUAYIO_USERNAME }}
          password: ${{ secrets.REGISTRY_QUAYIO_PASSWORD }}
          tag_names: true
